<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Financiën">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mijn Financiën</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --text:#1d2420; --muted:#6b736e; --line:#e8e6df;
  --accent:#e0849a; --accent-soft:#fbe9ee; --danger:#c8402e; --pos:#2f7d5f;
  --fixed:#4c6ef5; --var:#f08c00; --save:#2f9e77; --rest:#c3c8c5;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121513; --card:#1c201e; --text:#e9ece9; --muted:#9aa29d; --line:#2c312e;
    --accent:#f2a2b4; --accent-soft:#3a2229; --danger:#ff7b66; --pos:#5cc196; --rest:#4a514d; --shadow:none; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px calc(104px + env(safe-area-inset-bottom))}

header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;gap:8px}
.month{flex:1;display:flex;align-items:center;justify-content:space-between;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:3px}
.month button.lbl{border:0;background:none;font-weight:650;text-transform:capitalize;cursor:pointer;padding:4px 10px;border-radius:999px}
.iconbtn{border:0;background:transparent;width:36px;height:36px;border-radius:999px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--accent-soft)}
.iconbtn svg{width:18px;height:18px}
header>.iconbtn{background:var(--card);border:1px solid var(--line);width:40px;height:40px}

svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.title{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 12px}
.title h2{margin:0;font-size:24px;letter-spacing:-.02em}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.cardtitle{font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.cardtitle.out{margin:18px 4px 8px}
.hero .label{color:var(--muted);font-size:14px}
.hero .big{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.sub{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-top:6px}
.muted{color:var(--muted)} .small{font-size:12.5px} .neg{color:var(--danger)!important} .pos{color:var(--pos)}
.txt{color:var(--text)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.grow{flex:1;min-width:0}
.grow>div:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chips{display:flex;gap:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

.brow{padding:9px 0;cursor:pointer}
.brow+.brow{border-top:1px solid var(--line)}
.brow-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.brow .bar{height:6px}

.list{padding:4px 14px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.daylabel{font-size:12.5px;font-weight:650;color:var(--muted);padding:12px 0 2px;text-transform:capitalize}
.daylabel+.row{border-top:0}
.amt{font-weight:650;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.paidamt{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:4px 8px}
.paidamt:focus-within{border-color:var(--accent)}
.paidamt i{font-style:normal;color:var(--muted);font-weight:600}
.paidamt input{border:0;background:none;width:78px;text-align:right;font-weight:650;font-size:16px;outline:none;padding:0;font-variant-numeric:tabular-nums}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;cursor:pointer;padding:0}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.check svg{width:14px;height:14px}
.empty{color:var(--muted);text-align:center;padding:18px 8px;margin:0;font-size:14px}
.emptycard{text-align:center;padding:26px 16px}
.emptycard .empty{padding:0 0 12px}

.donutwrap{display:flex;align-items:center;gap:18px}
.donut{width:46%;max-width:190px;flex:none}
.dc1{font-size:4.3px;font-weight:700;text-anchor:middle;fill:var(--text)}
.dc2{font-size:2.7px;text-anchor:middle;fill:var(--muted)}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend span.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend b{font-variant-numeric:tabular-nums;font-weight:600}
.legend em{font-style:normal;color:var(--muted);font-size:12px;width:40px;text-align:right}
@media (max-width:400px){ .donutwrap{flex-direction:column} .donut{width:62%} .legend{width:100%} }

.pothead{display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer}
.big2{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.potfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;font-size:14px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.tile .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted);line-height:1.25}
.tile i{display:block;width:22px;height:4px;border-radius:9px;margin-bottom:8px}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--line);margin:4px 0 14px}
.stack i{display:block;height:100%}
.orow{display:flex;align-items:center;gap:10px;padding:8px 0;font-variant-numeric:tabular-nums}
.orow+.orow{border-top:1px solid var(--line)}
.orow.total{font-weight:700;border-top:2px solid var(--line)!important}
.orow em{font-style:normal;color:var(--muted);font-size:12.5px;width:52px;text-align:right}
.trend{width:100%;display:block}
.trend .tl{font-size:10px;fill:var(--muted);text-anchor:middle;text-transform:capitalize}
.trend .tl.cur{fill:var(--text);font-weight:700}
.tlegend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-top:8px}
.tlegend span{display:flex;align-items:center;gap:5px}
.note{font-size:13px;background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.note .grow{line-height:1.35}

nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
  font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:12px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent)}
nav button.on svg{stroke-width:2.2}

.fab{position:fixed;z-index:9;right:max(16px, calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;
  box-shadow:0 8px 20px rgba(224,132,154,.45);cursor:pointer}
.fab svg{width:26px;height:26px}
.fab[hidden]{display:none}

dialog{border:0;padding:0;width:100%;max-width:560px;margin:auto auto 0;border-radius:20px 20px 0 0;
  background:var(--card);color:var(--text);max-height:92vh}
@media (min-width:600px){ dialog{margin:auto;border-radius:20px;max-width:480px} }
dialog::backdrop{background:rgba(0,0,0,.4)}
.sheet{padding:16px 18px calc(18px + env(safe-area-inset-bottom))}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheethead h3{margin:0;font-size:19px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input:not([type=checkbox]),.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px;outline:none;min-height:46px}
.field input:focus,.field select:focus{border-color:var(--accent)}
.field small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.money{position:relative}
.money i{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted)}
.field .money input{padding-left:28px}
.field.check{display:flex;align-items:center;gap:10px;cursor:pointer}
.field.check input{width:20px;height:20px;accent-color:var(--accent)}
.field.check span{margin:0;color:var(--text);font-weight:500;font-size:15px}
.section{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.formactions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:650;cursor:pointer;font-size:15px}
.btn.primary{background:var(--accent);color:#fff;flex:1}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%;margin-bottom:8px;text-align:left;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line)}
.btn.block svg{width:18px;height:18px}
.p{font-size:14px;color:var(--muted);margin:0 0 14px}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="month">
      <button class="iconbtn" data-act="prevMonth" aria-label="Vorige maand"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="lbl" id="monthLabel" data-act="thisMonth" title="Naar deze maand"></button>
      <button class="iconbtn" data-act="nextMonth" aria-label="Volgende maand"><svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <button class="iconbtn" data-act="settings" aria-label="Instellingen"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <main id="view"></main>
</div>

<button class="fab" id="fab" aria-label="Toevoegen"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav><div class="in" id="nav"></div></nav>
<dialog id="sheet"><div class="sheet" id="sheetBody"></div></dialog>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* ============ Basis ============ */
const KEY = 'mijn-financien-v1';
const COLORS = ['#2f9e77','#4c6ef5','#f59f00','#e8590c','#ae3ec9','#1098ad','#d6336c','#74b816','#7950f2','#fa5252','#15aabf','#868e96'];
const FIXED_CATS = ['Wonen','Energie & water','Verzekeringen','Abonnementen','Vervoer','Belastingen','Overig'];

const TABS = [
  {id:'expenses', label:'Uitgaven',     icon:'<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 4h2.3l2.4 11.2a1 1 0 0 0 1 .8h9.3a1 1 0 0 0 1-.8L20.5 8H5.6"/>'},
  {id:'fixed',    label:'Vaste lasten', icon:'<path d="M3 11l9-7 9 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/>'},
  {id:'savings',  label:'Sparen',       icon:'<ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 6v6c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6"/><path d="M5 12v6c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8v-6"/>'},
  {id:'income',   label:'Inkomsten',    icon:'<path d="M12 3v11"/><path d="M7.5 9.5L12 14l4.5-4.5"/><path d="M4 16v4h16v-4"/>'},
  {id:'overview', label:'Overzicht',    icon:'<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.4A9 9 0 0 1 20.6 9H15z"/>'},
];
const CHECK = '<svg class="i" viewBox="0 0 24 24" style="stroke-width:3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const fmt = new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'});
const eur = v => fmt.format(v || 0);
const num = v => { let s = String(v ?? '').trim().replace(/[\s€]/g,''); if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); const n = parseFloat(s); return isFinite(n) ? n : 0; };
const sum = a => a.reduce((s,v) => s + num(v), 0);
const pctStr = (a,b) => b > 0 ? (a/b*100).toLocaleString('nl-NL',{maximumFractionDigits:1}) + '%' : '–';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const curMonth = () => todayISO().slice(0,7);
const daysIn = m => { const [y,mo] = m.split('-').map(Number); return new Date(y,mo,0).getDate(); };
function shiftMonth(m,n){ let [y,mo] = m.split('-').map(Number); mo += n; while(mo>12){mo-=12;y++} while(mo<1){mo+=12;y--} return y+'-'+pad(mo); }
function monthLabel(m,short){ const [y,mo] = m.split('-').map(Number); return new Date(y,mo-1,1).toLocaleDateString('nl-NL', short?{month:'short'}:{month:'long',year:'numeric'}).replace('.',''); }
function toDate(d){ const [y,mo,da] = d.split('-').map(Number); return new Date(y,mo-1,da); }
const fmtDate = d => d ? toDate(d).toLocaleDateString('nl-NL',{day:'numeric',month:'short'}) : '';
const fmtDateLong = d => toDate(d).toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
function dateInMonth(m, day){ return m + '-' + pad(Math.min(Math.max(1, day||1), daysIn(m))); }
const defaultDate = m => m === curMonth() ? todayISO() : m + '-01';
function colorFor(name){ let h = 0; for (const c of String(name)) h = (h*31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
const moneyInput = v => (v === '' || v == null) ? '' : String(Math.round(num(v)*100)/100).replace('.',',');

/* ============ Opslag ============ */
function defaults(){
  const cats = [['Boodschappen',400],['Uit eten & drinken',150],['Vervoer',100],['Kleding',75],['Persoonlijke verzorging',50],['Overig',100]];
  return {
    version:1,
    expenseCategories: cats.map(([name,budget],i) => ({id:uid(), name, budget, color:COLORS[i]})),
    expenses: [],
    fixedCosts: [],
    fixedPayments: {},
    pots: [],
    deposits: [],
    incomeSources: [{id:uid(), name:'Salaris', color:COLORS[0]}],
    incomes: [],
    lastBackup: null,
  };
}
function migrate(d){
  const base = defaults();
  for (const k of Object.keys(base)) if (d[k] === undefined) d[k] = Array.isArray(base[k]) ? [] : (base[k] && typeof base[k] === 'object' ? {} : base[k]);
  return d;
}
function load(){ try { const raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); } catch(e){} return defaults(); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){ toast('Opslaan is mislukt'); } }

let db = load();
const ui = { tab:'expenses', month:curMonth(), fixedGroup:'cat' };
try { const t = localStorage.getItem(KEY+'-tab'); if (TABS.some(x => x.id === t)) ui.tab = t; } catch(e){}

/* ============ Berekeningen ============ */
const inMonth = (arr,m) => arr.filter(x => x.date && x.date.startsWith(m));
const fixedForMonth = m => db.fixedCosts.filter(f => (!f.start || f.start <= m) && (!f.end || m <= f.end)).sort((a,b) => (a.day||99)-(b.day||99) || a.name.localeCompare(b.name));
const fixedPay = (m,id) => (db.fixedPayments[m] || {})[id];
function fixedAmount(f,m){ const p = fixedPay(m,f.id); return p && p.paid ? num(p.amount ?? f.amount) : num(f.amount); }
function totals(m){
  const income = sum(inMonth(db.incomes,m).map(x => x.amount));
  const variable = sum(inMonth(db.expenses,m).map(x => x.amount));
  const fixed = sum(fixedForMonth(m).map(f => fixedAmount(f,m)));
  const savings = sum(inMonth(db.deposits,m).map(x => x.amount));
  return { income, variable, fixed, savings, rest: income - variable - fixed - savings };
}
function potBalance(p,m){ const end = m + '-31'; return num(p.start) + sum(db.deposits.filter(d => d.potId === p.id && d.date <= end).map(d => d.amount)); }

/* ============ Bouwstenen ============ */
function bar(v,max,color){
  const p = max > 0 ? Math.min(100, Math.max(0, v/max*100)) : 0;
  const over = max > 0 && v > max + 0.004;
  return `<div class="bar"><i style="width:${p}%;${over ? 'background:var(--danger)' : color ? 'background:'+color : ''}"></i></div>`;
}
function donut(segs, center, sub){
  segs = segs.filter(s => s.value > 0);
  const total = sum(segs.map(s => s.value));
  let off = 25, parts = '';
  for (const s of segs){
    const p = s.value/total*100;
    parts += `<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${s.color}" stroke-width="5.6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"/>`;
    off -= p;
  }
  const legend = segs.map(s => `<div><span class="dot" style="background:${s.color}"></span><span class="n">${esc(s.label)}</span><b>${eur(s.value)}</b><em>${pctStr(s.value,total)}</em></div>`).join('');
  return `<div class="donutwrap"><svg viewBox="0 0 42 42" class="donut"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--line)" stroke-width="5.6"/>${parts}<text x="21" y="21.2" class="dc1">${esc(center)}</text><text x="21" y="25.6" class="dc2">${esc(sub)}</text></svg><div class="legend">${legend || '<span class="muted">Nog geen gegevens</span>'}</div></div>`;
}
function dayList(list, rowFn){
  let out = '', last = '';
  for (const x of list){ if (x.date !== last){ out += `<div class="daylabel">${fmtDateLong(x.date)}</div>`; last = x.date; } out += rowFn(x); }
  return `<div class="card list">${out}</div>`;
}
const emptyCard = (text, btn) => `<div class="card emptycard"><p class="empty">${text}</p>${btn || ''}</div>`;

/* ============ Tab: Uitgaven ============ */
function renderExpenses(m){
  const list = inMonth(db.expenses,m).sort((a,b) => b.date.localeCompare(a.date));
  const spent = sum(list.map(x => x.amount));
  const budget = sum(db.expenseCategories.map(c => c.budget));
  const per = {}; list.forEach(x => { const k = x.catId || ''; per[k] = (per[k]||0) + num(x.amount); });
  const left = budget - spent;
  const catRow = (c) => {
    const s = per[c.id] || 0, b = num(c.budget), over = b > 0 && s > b + 0.004;
    return `<div class="brow" data-act="editCat" data-id="${c.id}"><div class="brow-top"><span class="dot" style="background:${c.color}"></span><span class="grow">${esc(c.name)}</span><span class="${over?'neg':''}"><b>${eur(s)}</b>${b>0?` <span class="muted">/ ${eur(b)}</span>`:''}</span></div>${b>0 ? bar(s,b,c.color) : ''}</div>`;
  };
  const catMap = Object.fromEntries(db.expenseCategories.map(c => [c.id,c]));
  return `
  <div class="title"><h2>Uitgaven</h2><button class="chip" data-act="manageCats">Budgetten</button></div>
  <div class="card hero">
    <div class="label">Uitgegeven in ${monthLabel(m)}</div>
    <div class="big">${eur(spent)}</div>
    ${budget > 0 ? `${bar(spent,budget)}<div class="sub"><span>Budget ${eur(budget)}</span><span class="${left<0?'neg':''}">${left<0 ? eur(-left)+' over budget' : 'Nog '+eur(left)+' te besteden'}</span></div>` : `<div class="sub">Stel budgetten in via “Budgetten”.</div>`}
  </div>
  <div class="card"><div class="cardtitle">Per categorie</div>
    ${db.expenseCategories.map(catRow).join('') || '<p class="empty">Nog geen categorieën.</p>'}
    ${per[''] ? `<div class="brow"><div class="brow-top"><span class="dot" style="background:var(--rest)"></span><span class="grow">Zonder categorie</span><b>${eur(per[''])}</b></div></div>` : ''}
  </div>
  <div class="cardtitle out">Transacties</div>
  ${list.length ? dayList(list, x => { const c = catMap[x.catId]; return `
    <div class="row" data-act="editExpense" data-id="${x.id}"><span class="dot" style="background:${c ? c.color : 'var(--rest)'}"></span>
    <div class="grow"><div>${esc(x.desc || (c ? c.name : 'Uitgave'))}</div><div class="muted small">${esc(c ? c.name : 'Zonder categorie')}</div></div>
    <div class="amt">${eur(x.amount)}</div></div>`; })
  : emptyCard('Nog geen uitgaven deze maand.', '<button class="chip" data-act="addExpense">+ Uitgave toevoegen</button>')}`;
}
function expenseForm(x){
  const isNew = !x;
  x = x || { amount:'', desc:'', date:defaultDate(ui.month), catId: db.expenseCategories[0]?.id || '' };
  openForm({
    title: isNew ? 'Nieuwe uitgave' : 'Uitgave bewerken',
    fields: [
      {name:'amount', label:'Bedrag', type:'money', value:x.amount, autofocus:isNew},
      {name:'desc', label:'Omschrijving', value:x.desc, placeholder:'Bijv. Albert Heijn'},
      {name:'catId', label:'Categorie', type:'select', value:x.catId || '', options:[...db.expenseCategories.map(c => ({value:c.id,label:c.name})), {value:'',label:'Zonder categorie'}]},
      {name:'date', label:'Datum', type:'date', value:x.date},
    ],
    onSave: v => {
      if (!v.amount) return 'Vul een bedrag in';
      if (!v.date) return 'Kies een datum';

      if (isNew){ x.id = uid(); db.expenses.push(x); }
      ui.month = v.date.slice(0,7);
    },

    <div>${rows || '<p class="empty">Nog geen categorieën.</p>'}</div>
    <div class="formactions"><button class="btn primary" data-act="editCat" data-back="1">+ Categorie toevoegen</button></div>`);
}
function catForm(c, back){
  const isNew = !c;
  c = c || { name:'', budget:'', color: COLORS[db.expenseCategories.length % COLORS.length] };
  openForm({
    title: isNew ? 'Nieuwe categorie' : 'Categorie bewerken',
    fields: [
      {name:'name', label:'Naam', value:c.name, autofocus:isNew},

    ],
    back: back ? openCatManager : null,
    onSave: v => {
      if (!v.name) return 'Geef de categorie een naam';
      Object.assign(c, {name:v.name, budget:v.budget});
      if (isNew){ c.id = uid(); db.expenseCategories.push(c); }
    },
    onDelete: isNew ? null : () => {

      db.expenses.forEach(e => { if (e.catId === c.id) e.catId = ''; });
    },
    deleteConfirm: 'Categorie verwijderen? Bestaande uitgaven blijven staan onder “Zonder categorie”.',
  });
}

/* ============ Tab: Vaste lasten ============ */
function renderFixed(m){
  const items = fixedForMonth(m);
  const planned = sum(items.map(f => f.amount));
  const actual = sum(items.map(f => fixedAmount(f,m)));
  const paid = sum(items.filter(f => fixedPay(m,f.id)?.paid).map(f => fixedAmount(f,m)));
  const nPaid = items.filter(f => fixedPay(m,f.id)?.paid).length;
  let segs;
  if (ui.fixedGroup === 'item') segs = items.map(f => ({label:f.name, value:fixedAmount(f,m), color:colorFor(f.name)}));
  else { const g = {}; items.forEach(f => { const k = f.category || 'Overig'; g[k] = (g[k]||0) + fixedAmount(f,m); }); segs = Object.entries(g).map(([k,v]) => ({label:k, value:v, color:colorFor(k)})); }
  segs.sort((a,b) => b.value - a.value);
  segs.forEach((s,i) => s.color = COLORS[i % COLORS.length]);
  const rows = items.map(f => {
    const p = fixedPay(m,f.id), isPaid = !!(p && p.paid), amt = fixedAmount(f,m);
    const diff = isPaid && Math.abs(amt - num(f.amount)) > 0.004;
    return `<div class="row" data-act="editFixed" data-id="${f.id}">
      <button class="check ${isPaid?'on':''}" data-act="togglePaid" data-id="${f.id}" aria-label="${isPaid?'Markeer als niet betaald':'Markeer als betaald'}">${isPaid ? CHECK : ''}</button>
      <div class="grow"><div>${esc(f.name)}</div><div class="muted small">${isPaid ? 'Betaald op '+fmtDate(p.date) : (f.day ? 'Verwacht op de '+f.day+'e' : 'Nog niet betaald')} · ${esc(f.category || 'Overig')}</div></div>
      <div class="amt">${isPaid ? `<label class="paidamt"><i>€</i><input inputmode="decimal" data-paid="${f.id}" value="${num(amt).toFixed(2).replace('.',',')}" aria-label="Werkelijk betaald bedrag ${esc(f.name)}"></label>` : eur(amt)}${diff ? `<div class="small ${amt > num(f.amount) ? 'neg' : 'pos'}">budget ${eur(f.amount)}</div>` : (isPaid ? `<div class="small muted">tik om aan te passen</div>` : '')}</div></div>`;
  }).join('');
  return `
  <div class="title"><h2>Vaste lasten</h2></div>
  <div class="card hero">
    <div class="label">Totaal vaste lasten ${monthLabel(m)}</div>
    <div class="big">${eur(actual)}</div>
    ${items.length ? `${bar(paid, actual)}<div class="sub"><span>${nPaid} van ${items.length} betaald · ${eur(paid)}</span><span>Nog ${eur(Math.max(0,actual-paid))}</span></div>` : ''}
    ${items.length && Math.abs(actual-planned) > 0.004 ? `<div class="sub"><span>Begroot: ${eur(planned)}</span><span class="${actual>planned?'neg':'pos'}">${actual>planned?'+':'−'}${eur(Math.abs(actual-planned))}</span></div>` : ''}
  </div>
  ${items.length ? `<div class="card"><div class="title" style="margin:0 0 12px"><div class="cardtitle" style="margin:0">Verdeling</div>
    <div class="chips"><button class="chip ${ui.fixedGroup==='cat'?'on':''}" data-act="fixedGroup" data-id="cat">Categorie</button><button class="chip ${ui.fixedGroup==='item'?'on':''}" data-act="fixedGroup" data-id="item">Per post</button></div></div>
    ${donut(segs, eur(actual), 'per maand')}</div>
  <div class="cardtitle out">Posten</div><div class="card list">${rows}</div>`
  : emptyCard('Nog geen vaste lasten. Voeg bijvoorbeeld je hypotheek, energie en verzekeringen toe.', '<button class="chip" data-act="addFixed">+ Vaste last toevoegen</button>')}`;
}
function fixedForm(f){
  const isNew = !f, m = ui.month;
  f = f || { name:'', amount:'', category:'', day:'' };
  const p = isNew ? null : fixedPay(m, f.id);
  const cats = [...new Set([...FIXED_CATS, ...db.fixedCosts.map(x => x.category).filter(Boolean)])];
  const fields = [
    {name:'name', label:'Naam', value:f.name, placeholder:'Bijv. Hypotheek', autofocus:isNew},
    {name:'amount', label:'Budget per maand', type:'money', value:f.amount},
    {name:'category', label:'Categorie', value:f.category, list:'fixedcats', datalist:cats, placeholder:'Bijv. Wonen'},
    {name:'day', label:'Dag van afschrijving (optioneel)', type:'number', value:f.day, min:1, max:31, placeholder:'1 – 31'},
  ];
  if (!isNew){
    fields.push({section:`Betaling ${monthLabel(m)}`});
    fields.push({name:'paid', label:'Betaald', type:'checkbox', value:!!(p && p.paid)});
    fields.push({name:'paidDate', label:'Betaaldatum', type:'date', value:(p && p.date) || dateInMonth(m, f.day || 1)});
    fields.push({name:'paidAmount', label:'Werkelijk betaald bedrag', type:'money', value:(p && p.amount != null) ? p.amount : f.amount});
    fields.push({section:'Looptijd'});
    fields.push({name:'stop', label: f.end ? `Loopt tot en met ${monthLabel(f.end)}` : `Stopt na ${monthLabel(m)}`, type:'checkbox', value:!!f.end});
  }
  openForm({
    title: isNew ? 'Nieuwe vaste last' : 'Vaste last bewerken',
    fields,
    onSave: v => {
      if (!v.name) return 'Geef de vaste last een naam';
      Object.assign(f, {name:v.name, amount:v.amount, category:v.category || 'Overig', day: v.day ? Math.min(31, Math.max(1, parseInt(v.day))) : ''});
      if (isNew){ f.id = uid(); f.start = m; f.end = null; db.fixedCosts.push(f); return; }
      db.fixedPayments[m] = db.fixedPayments[m] || {};
      if (v.paid) db.fixedPayments[m][f.id] = {paid:true, date:v.paidDate || dateInMonth(m, f.day), amount:v.paidAmount};
      else delete db.fixedPayments[m][f.id];
      if (v.stop && !f.end) f.end = m;
      if (!v.stop) f.end = null;
    },
    onDelete: isNew ? null : () => {
      db.fixedCosts = db.fixedCosts.filter(x => x.id !== f.id);
      for (const k in db.fixedPayments) delete db.fixedPayments[k][f.id];
    },
    deleteConfirm: 'Helemaal verwijderen, ook uit eerdere maanden? Wil je hem alleen stopzetten, gebruik dan “Stopt na …”.',
  });
}
function togglePaid(id){
  const m = ui.month, f = db.fixedCosts.find(x => x.id === id); if (!f) return;
  db.fixedPayments[m] = db.fixedPayments[m] || {};
  if (db.fixedPayments[m][id]?.paid) delete db.fixedPayments[m][id];
  else db.fixedPayments[m][id] = {paid:true, date: m === curMonth() ? todayISO() : dateInMonth(m, f.day || 1), amount:num(f.amount)};
  save(); render();
}

/* ============ Tab: Sparen ============ */
function renderSavings(m){
  const t = totals(m);
  const deps = inMonth(db.deposits,m).sort((a,b) => b.date.localeCompare(a.date));
  const totalAll = sum(db.pots.map(p => potBalance(p,m)));
  const potMap = Object.fromEntries(db.pots.map(p => [p.id,p]));
  const cards = db.pots.map(p => {
    const bal = potBalance(p,m), goal = num(p.goal), monthly = num(p.monthly);
    const thisM = sum(deps.filter(d => d.potId === p.id).map(d => d.amount));
    return `<div class="card">
      <div class="pothead" data-act="editPot" data-id="${p.id}"><span class="dot" style="background:${p.color}"></span><b class="grow">${esc(p.name)}</b><span class="big2">${eur(bal)}</span></div>
      ${goal > 0 ? `${bar(Math.min(bal,goal), goal, p.color)}<div class="sub"><span>Doel ${eur(goal)} · ${pctStr(bal,goal)}</span><span class="${bal>=goal?'pos':''}">${bal >= goal ? 'Doel bereikt ✓' : 'Nog '+eur(goal-bal)}</span></div>` : ''}
      <div class="potfoot"><span class="muted">Deze maand: <b class="${monthly>0 && thisM>=monthly ? 'pos' : 'txt'}">${eur(thisM)}</b>${monthly > 0 ? ` van ${eur(monthly)}` : ''}</span>
      <button class="chip" data-act="addDeposit" data-id="${p.id}">+ Inleggen</button></div></div>`;
  }).join('');
  const prevHas = inMonth(db.deposits, shiftMonth(m,-1)).length > 0;
  return `
  <div class="title"><h2>Sparen</h2><button class="chip" data-act="addPot">+ Potje</button></div>
  <div class="card hero">
    <div class="label">Gespaard in ${monthLabel(m)}</div>
    <div class="big">${eur(t.savings)}</div>
    <div class="sub"><span>${t.income > 0 ? pctStr(t.savings,t.income)+' van je inkomen' : 'Voeg inkomsten toe voor je spaarpercentage'}</span><span>Totaal in potjes: <b class="txt">${eur(totalAll)}</b></span></div>
  </div>
  ${cards || emptyCard('Nog geen spaarpotjes. Maak er een aan met een doel, bijvoorbeeld “Buffer” of “Vakantie”.', '<button class="chip" data-act="addPot">+ Potje aanmaken</button>')}
  ${db.pots.length ? `<div class="cardtitle out">Inleg deze maand</div>
  ${deps.length ? dayList(deps, d => { const p = potMap[d.potId]; return `<div class="row" data-act="editDeposit" data-id="${d.id}"><span class="dot" style="background:${p ? p.color : 'var(--rest)'}"></span><div class="grow"><div>${esc(p ? p.name : 'Onbekend potje')}</div>${d.note ? `<div class="muted small">${esc(d.note)}</div>` : ''}</div><div class="amt ${num(d.amount)<0?'neg':''}">${eur(d.amount)}</div></div>`; })
  : emptyCard('Nog niets ingelegd deze maand.', prevHas ? '<button class="chip" data-act="copyPrev" data-id="deposits">Kopieer inleg van vorige maand</button>' : '')}` : ''}`;
}
function potForm(p){
  const isNew = !p;
  p = p || { name:'', goal:'', monthly:'', start:'', color: COLORS[db.pots.length % COLORS.length] };
  openForm({

function depositForm(d, potId){
  if (!db.pots.length){ toast('Maak eerst een spaarpotje aan'); potForm(); return; }
  const isNew = !d;
  const pot = db.pots.find(p => p.id === potId);
  d = d || { potId: potId || db.pots[0].id, amount: pot && num(pot.monthly) ? pot.monthly : '', date: defaultDate(ui.month), note:'' };
  openForm({
    title: isNew ? 'Inleggen' : 'Inleg bewerken',
    fields: [
      {name:'potId', label:'Potje', type:'select', value:d.potId, options: db.pots.map(p => ({value:p.id, label:p.name}))},
      {name:'amount', label:'Bedrag', type:'money', value:d.amount, hint:'Gebruik een minteken voor een opname, bijv. -50.', autofocus:isNew},
      {name:'date', label:'Datum', type:'date', value:d.date},
      {name:'note', label:'Notitie (optioneel)', value:d.note},
    ],
    onSave: v => {
      if (!v.amount) return 'Vul een bedrag in';
      if (!v.date) return 'Kies een datum';
      Object.assign(d, {potId:v.potId, amount:v.amount, date:v.date, note:v.note});
      if (isNew){ d.id = uid(); db.deposits.push(d); }
      ui.month = v.date.slice(0,7);
    },
    onDelete: isNew ? null : () => { db.deposits = db.deposits.filter(x => x.id !== d.id); },
  });
}

/* ============ Tab: Inkomsten ============ */
function renderIncome(m){
  const list = inMonth(db.incomes,m).sort((a,b) => b.date.localeCompare(a.date));

  const srcMap = Object.fromEntries(db.incomeSources.map(s => [s.id,s]));

/* ============ Tab: Overzicht ============ */
function renderOverview(m){
  const t = totals(m);
  const out = t.fixed + t.variable + Math.max(0, t.savings);
  const base = Math.max(t.income, out) || 1;
  const parts = [
    {k:'Vaste lasten', v:t.fixed, c:'var(--fixed)'},
    {k:'Variabele uitgaven', v:t.variable, c:'var(--var)'},
    {k:'Sparen', v:t.savings, c:'var(--save)'},
  ];
  const stack = parts.map(p => p.v > 0 ? `<i style="width:${p.v/base*100}%;background:${p.c}"></i>` : '').join('') + (t.rest > 0 ? `<i style="width:${t.rest/base*100}%;background:var(--rest)"></i>` : '');
  const varBudget = sum(db.expenseCategories.map(c => c.budget));
  const backupOld = !db.lastBackup || (Date.now() - toDate(db.lastBackup).getTime()) > 30*864e5;
  const hasData = db.expenses.length + db.incomes.length + db.deposits.length + db.fixedCosts.length > 0;
  return `
  <div class="title"><h2>Overzicht</h2></div>
  ${backupOld && hasData ? `<div class="note"><div class="grow">${db.lastBackup ? 'Je laatste back-up is van '+fmtDate(db.lastBackup)+'.' : 'Je hebt nog geen back-up gemaakt.'} Je gegevens staan alleen in deze browser.</div><button class="chip" data-act="export">Back-up</button></div>` : ''}
  <div class="tiles">
    <div class="tile"><i style="background:var(--save)"></i><div class="v">${pctStr(t.savings,t.income)}</div><div class="l">gespaard van inkomen</div></div>
    <div class="tile"><i style="background:var(--fixed)"></i><div class="v">${pctStr(t.fixed,t.income)}</div><div class="l">naar vaste lasten</div></div>
    <div class="tile"><i style="background:var(--var)"></i><div class="v">${pctStr(t.variable,t.income)}</div><div class="l">naar variabele uitgaven</div></div>
  </div>
  <div class="card">
    <div class="cardtitle">Balans ${monthLabel(m)}</div>
    ${t.income > 0 ? `<div class="stack">${stack}</div>` : '<p class="p">Voeg inkomsten toe om de verdeling in procenten te zien.</p>'}
    <div class="orow"><span class="dot" style="background:var(--pos)"></span><span class="grow">Inkomsten</span><b class="pos">${eur(t.income)}</b><em></em></div>
    ${parts.map(p => `<div class="orow"><span class="dot" style="background:${p.c}"></span><span class="grow">${p.k}</span><b>− ${eur(p.v)}</b><em>${pctStr(p.v,t.income)}</em></div>`).join('')}
    <div class="orow total"><span class="dot" style="background:${t.rest<0?'var(--danger)':'var(--rest)'}"></span><span class="grow">${t.rest < 0 ? 'Tekort' : 'Over'}</span><b class="${t.rest<0?'neg':''}">${eur(t.rest)}</b><em>${pctStr(Math.abs(t.rest),t.income)}</em></div>
  </div>
  <div class="card">
    <div class="cardtitle">Totale uitgaven</div>
    ${donut([{label:'Vaste lasten', value:t.fixed, color:'var(--fixed)'},{label:'Variabel', value:t.variable, color:'var(--var)'}], eur(t.fixed+t.variable), 'uitgegeven')}
    ${varBudget > 0 ? `<div class="sub" style="margin-top:14px"><span>Variabel budget gebruikt</span><span class="${t.variable>varBudget?'neg':''}">${pctStr(t.variable,varBudget)} van ${eur(varBudget)}</span></div>` : ''}
  </div>
  <div class="card">
    <div class="cardtitle">Laatste 6 maanden</div>
    ${trend(m)}
    <div class="tlegend"><span><span class="dot" style="background:var(--fixed)"></span>Vaste lasten</span><span><span class="dot" style="background:var(--var)"></span>Variabel</span><span><span class="dot" style="background:var(--save)"></span>Sparen</span><span><span style="display:inline-block;width:14px;height:2.5px;background:var(--text);border-radius:2px"></span>Inkomsten</span></div>
  </div>`;
}
function trend(m){
  const data = [...Array(6)].map((_,i) => { const x = shiftMonth(m, i-5); return {m:x, ...totals(x)}; });
  const max = Math.max(1, ...data.map(d => Math.max(d.income, d.fixed + d.variable + Math.max(0,d.savings))));
  const W = 320, H = 140, cw = W/6;
  let g = `<line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/>`;
  data.forEach((d,i) => {
    const w = cw*0.5, x = i*cw + (cw-w)/2; let y = H;
    for (const [v,c] of [[d.fixed,'var(--fixed)'],[d.variable,'var(--var)'],[Math.max(0,d.savings),'var(--save)']]){
      if (v <= 0) continue; const h = v/max*(H-8); y -= h;
      g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
    }
    if (d.income > 0){ const iy = H - d.income/max*(H-8); g += `<line x1="${x-5}" x2="${x+w+5}" y1="${iy}" y2="${iy}" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>`; }
    g += `<text x="${x+w/2}" y="${H+15}" class="tl ${d.m===m?'cur':''}">${monthLabel(d.m,true)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H+20}" class="trend">${g}</svg>`;
}

/* ============ Formulieren & sheet ============ */
const sheet = document.getElementById('sheet'), sheetBody = document.getElementById('sheetBody');
function openSheet(html){ sheetBody.innerHTML = html; if (!sheet.open) sheet.showModal(); sheet.scrollTop = 0; }
function closeSheet(){ if (sheet.open) sheet.close(); }
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

function fieldHtml(f){
  if (f.section) return `<div class="section">${esc(f.section)}</div>`;
  const v = f.value ?? '';
  const hint = f.hint ? `<small>${f.hint}</small>` : '';
  const af = f.autofocus && matchMedia('(pointer:fine)').matches ? 'autofocus' : '';
  if (f.type === 'select') return `<label class="field"><span>${f.label}</span><select name="${f.name}">${f.options.map(o => `<option value="${esc(o.value)}" ${o.value === v ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>${hint}</label>`;
  if (f.type === 'checkbox') return `<label class="field check"><input type="checkbox" name="${f.name}" ${v ? 'checked' : ''}><span>${f.label}</span></label>`;
  if (f.type === 'money') return `<label class="field"><span>${f.label}</span><div class="money"><i>€</i><input name="${f.name}" inputmode="decimal" autocomplete="off" value="${esc(moneyInput(v))}" placeholder="0,00" ${af}></div>${hint}</label>`;
  return `<label class="field"><span>${f.label}</span><input name="${f.name}" type="${f.type || 'text'}" value="${esc(v)}" autocomplete="off" ${f.list ? `list="${f.list}"` : ''} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''} ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} ${f.type==='number'?'inputmode="numeric"':''} ${af}>${f.datalist ? `<datalist id="${f.list}">${f.datalist.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : ''}${hint}</label>`;
}
function openForm(o){
  openSheet(`<form novalidate><div class="sheethead"><h3>${esc(o.title)}</h3><button type="button" class="iconbtn" data-close aria-label="Sluiten">✕</button></div>
    ${o.fields.map(fieldHtml).join('')}
    <div class="formactions">${o.onDelete ? `<button type="button" class="btn ghost danger" data-del>Verwijderen</button>` : ''}<button class="btn primary" type="submit">Opslaan</button></div></form>`);
  const form = sheetBody.querySelector('form');
  const done = () => { save(); render(); if (o.back) o.back(); else closeSheet(); };
  form.onsubmit = e => {
    e.preventDefault();
    const v = {};
    for (const f of o.fields){ if (!f.name) continue; const el = form.elements[f.name]; v[f.name] = f.type === 'checkbox' ? el.checked : f.type === 'money' ? num(el.value) : el.value.trim(); }
    const err = o.onSave(v);
    if (err){ toast(err); return; }
    done();
  };
  const del = form.querySelector('[data-del]');
  if (del) del.onclick = () => { if (confirm(o.deleteConfirm || 'Weet je zeker dat je dit wilt verwijderen?')){ o.onDelete(); done(); } };
}

/* ============ Instellingen / back-up ============ */
function openSettings(){
  const ico = p => `<svg class="i" viewBox="0 0 24 24">${p}</svg>`;
  openSheet(`<div class="sheethead"><h3>Gegevens</h3><button class="iconbtn" data-close aria-label="Sluiten">✕</button></div>
    <p class="p">Alles wordt alleen op dit apparaat, in deze browser, opgeslagen. Er gaat niets naar een server. Maak daarom af en toe een back-up, en gebruik die ook om je gegevens naar een ander apparaat over te zetten.<br><br>Laatste back-up: <b class="txt">${db.lastBackup ? fmtDate(db.lastBackup) + ' ' + db.lastBackup.slice(0,4) : 'nog nooit'}</b></p>
    <button class="btn block" data-act="export">${ico('<path d="M12 3v12M7 10l5 5 5-5M4 19h16"/>')}Back-up downloaden</button>
    <button class="btn block" data-act="import">${ico('<path d="M12 15V3M7 8l5-5 5 5M4 19h16"/>')}Back-up terugzetten</button>
    <button class="btn block danger" data-act="reset">${ico('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>')}Alles wissen</button>`);
}
function exportData(){
  db.lastBackup = todayISO(); save();
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `financien-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Back-up gedownload'); render(); if (sheet.open) openSettings();
}
document.getElementById('importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.expenses) || !Array.isArray(data.fixedCosts)) throw 0;
    if (!confirm('Dit vervangt al je huidige gegevens door de back-up. Doorgaan?')) return;
    db = migrate(data); save(); closeSheet(); render(); toast('Back-up teruggezet');
  } catch(_) { toast('Dit lijkt geen geldig back-upbestand'); }
});

/* ============ Render & acties ============ */
function render(){
  document.getElementById('monthLabel').textContent = monthLabel(ui.month);
  const views = {expenses:renderExpenses, fixed:renderFixed, savings:renderSavings, income:renderIncome, overview:renderOverview};
  document.getElementById('view').innerHTML = views[ui.tab](ui.month);
  document.getElementById('nav').innerHTML = TABS.map(t => `<button class="${t.id===ui.tab?'on':''}" data-act="tab" data-id="${t.id}"><svg class="i" viewBox="0 0 24 24">${t.icon}</svg>${t.label}</button>`).join('');
  const fab = document.getElementById('fab');
  const fabAct = {expenses:'addExpense', fixed:'addFixed', savings:'addDeposit', income:'addIncome'}[ui.tab];
  fab.hidden = !fabAct; if (fabAct) fab.dataset.act = fabAct;
}
const find = (arr,id) => arr.find(x => x.id === id);
const ACTIONS = {
  tab: id => { ui.tab = id; try { localStorage.setItem(KEY+'-tab', id); } catch(e){} render(); window.scrollTo(0,0); },
  prevMonth: () => { ui.month = shiftMonth(ui.month,-1); render(); },
  nextMonth: () => { ui.month = shiftMonth(ui.month,1); render(); },
  thisMonth: () => { ui.month = curMonth(); render(); },
  addExpense: () => expenseForm(),
  editExpense: id => expenseForm(find(db.expenses,id)),
  manageCats: () => openCatManager(),
  editCat: (id,el) => catForm(id ? find(db.expenseCategories,id) : null, !!el.dataset.back),
  addFixed: () => fixedForm(),
  editFixed: id => fixedForm(find(db.fixedCosts,id)),
  togglePaid: id => togglePaid(id),
  fixedGroup: id => { ui.fixedGroup = id; render(); },
  addPot: () => potForm(),
  editPot: id => potForm(find(db.pots,id)),
  addDeposit: id => depositForm(null, id),
  editDeposit: id => depositForm(find(db.deposits,id)),
  addIncome: () => incomeForm(),
  editIncome: id => incomeForm(find(db.incomes,id)),
  manageSources: () => openSourceManager(),
  editSource: (id,el) => sourceForm(id ? find(db.incomeSources,id) : null, !!el.dataset.back),
  copyPrev: kind => {
    const src = inMonth(db[kind], shiftMonth(ui.month,-1));
    src.forEach(x => db[kind].push({...x, id:uid(), date: dateInMonth(ui.month, +x.date.slice(8,10))}));
    save(); render(); toast(`${src.length} ${src.length === 1 ? 'regel' : 'regels'} gekopieerd`);
  },
  settings: () => openSettings(),
  export: () => exportData(),
  import: () => document.getElementById('importFile').click(),
  reset: () => { if (confirm('Weet je zeker dat je ALLE gegevens wilt wissen? Dit kan niet ongedaan worden gemaakt.')){ db = defaults(); save(); closeSheet(); render(); toast('Alles gewist'); } },
};
document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')){ closeSheet(); return; }
  if (e.target.closest('.paidamt')) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  e.preventDefault(); e.stopPropagation(); fn(el.dataset.id, el);
});

document.addEventListener('change', e => {
  const id = e.target.dataset && e.target.dataset.paid; if (!id) return;
  const p = fixedPay(ui.month, id); if (!p) return;
  p.amount = num(e.target.value); save(); render(); toast('Bedrag opgeslagen');
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.paid) e.target.blur(); });

let toastTimer;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }

render();
</script>
</body>
